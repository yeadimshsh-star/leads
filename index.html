<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003DB8">
<title>יעדים - לידים ולקוחות</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  html, body { overscroll-behavior-y: contain; }
  #login { position: fixed; inset: 0; z-index: 50; background: linear-gradient(160deg, #003DB8, #0B57D9 70%, #14CCAB); display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #fff; padding: 24px; text-align: center; }
  #login.open { display: flex; }
  #login .logo-card { background: #fff; border-radius: 18px; padding: 14px 22px; }
  #login .logo-card svg { height: 64px; width: auto; display: block; }
  .lead .drag { cursor: grab; color: var(--muted); font-size: 20px; padding: 0 2px 0 6px; touch-action: none; }
  .sortable-ghost { opacity: .4; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #003DB8; --teal: #14CCAB; --green: #99D475;
    --bg: #F3F6FB; --card: #fff; --text: #1B2433; --muted: #6B7689; --line: #E1E6EF;
    --red: #D93025; --orange: #F29900; --redbg: #FDECEA; --orangebg: #FFF4E0; --greenbg: #EAF7E1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Heebo, Arial, sans-serif; font-size: 15px; }
  button, input, select, textarea { font-family: inherit; font-size: 15px; }
  header { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; padding: 8px 14px; }
  header .logo { height: 38px; width: auto; }
  header .who { margin-inline-start: auto; color: var(--muted); font-size: 13px; text-align: left; }
  header button { border: 0; background: none; color: var(--blue); font-size: 20px; cursor: pointer; padding: 4px 6px; }
  main { max-width: 900px; margin: 0 auto; padding: 12px 12px 90px; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; z-index: 5; padding-bottom: env(safe-area-inset-bottom); background: #fff; border-top: 1px solid var(--line);
    display: flex; justify-content: center; }
  nav button { flex: 1; max-width: 180px; border: 0; background: none; padding: 9px 0 11px; color: var(--muted); cursor: pointer; font-size: 13px; }
  nav button b { display: flex; justify-content: center; height: 26px; margin-bottom: 2px; }
  nav button b svg { width: 26px; height: 26px; fill: currentColor; }
  html, body { overflow-x: hidden; max-width: 100%; }
  .tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; margin-bottom: 4px; }
  .tablewrap table { min-width: 100%; }
  td.tot, th.tot, tr.total td { font-weight: 700; color: var(--blue); }
  .icon svg { width: 20px; height: 20px; }
  .icon.wa { color: #25D366; } .icon.ph { color: var(--blue); }
  .btn svg { width: 18px; height: 18px; vertical-align: -3px; fill: currentColor; }
  .lead { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .sortable-chosen { box-shadow: 0 8px 24px rgba(0, 61, 184, .25); }
  .stat { cursor: pointer; }
  .stat:active { transform: scale(.97); }
  nav button.on { color: var(--blue); font-weight: 700; box-shadow: inset 0 3px 0 var(--teal); }
  h2 { font-size: 18px; margin: 6px 2px 10px; color: var(--blue); }
  h3 { font-size: 15px; margin: 16px 2px 8px; color: var(--muted); font-weight: 500; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  .lead { display: flex; gap: 10px; align-items: center; cursor: pointer; border-inline-start: 4px solid transparent; }
  .lead.overdue { border-inline-start-color: var(--red); }
  .lead.today { border-inline-start-color: var(--orange); }
  .lead .main { flex: 1; min-width: 0; }
  .lead .name { font-weight: 700; }
  .lead .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lead .acts { display: flex; gap: 6px; }
  .icon { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: #fff; display: inline-flex;
    align-items: center; justify-content: center; text-decoration: none; font-size: 18px; cursor: pointer; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: #EEF2FA; color: var(--blue); margin-inline-end: 4px; }
  .badge.red { background: var(--redbg); color: var(--red); }
  .badge.orange { background: var(--orangebg); color: #9A6100; }
  .badge.green { background: var(--greenbg); color: #3A7A12; }
  .badge.gray { background: #F0F0F0; color: #666; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 24px; color: var(--blue); }
  .stat.red b { color: var(--red); } .stat.orange b { color: var(--orange); }
  .stat span { font-size: 12px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 5px 12px; cursor: pointer; font-size: 14px; }
  .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 8px; }
  input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; color: var(--text); }
  textarea { min-height: 70px; resize: vertical; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 2px 3px; }
  .btn { border: 0; border-radius: 8px; padding: 9px 14px; background: var(--blue); color: #fff; cursor: pointer; font-weight: 500; }
  .btn.teal { background: var(--teal); color: #05352C; }
  .btn.light { background: #EEF2FA; color: var(--blue); }
  .btn.ghost { background: #fff; border: 1px solid var(--line); color: var(--text); }
  .btn.on { outline: 3px solid var(--teal); }
  .btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .muted { color: var(--muted); font-size: 13px; }
  .notes { white-space: pre-wrap; line-height: 1.55; font-size: 14px; max-height: 320px; overflow: auto; background: #FAFBFD; border-radius: 8px; padding: 10px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: center; font-size: 14px; }
  th { background: #EEF2FA; color: var(--blue); font-weight: 500; }
  td:first-child, th:first-child { text-align: right; }
  .num-red { color: var(--red); font-weight: 700; } .num-orange { color: var(--orange); font-weight: 700; }
  /* חלון ליד */
  #sheet { position: fixed; inset: 0; z-index: 10; background: rgba(10, 20, 40, .35); display: none; }
  #sheet.open { display: block; }
  #sheet .panel { position: absolute; inset: 0; margin: 0 auto; max-width: 760px; background: var(--bg); overflow: auto; padding: 0 12px 40px; }
  #sheet .top { position: sticky; top: 0; background: var(--bg); padding: 10px 0 8px; display: flex; align-items: center; gap: 8px; z-index: 2; }
  #sheet .top h2 { margin: 0; flex: 1; }
  details summary { cursor: pointer; color: var(--blue); font-weight: 500; padding: 4px 0; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 10px; }
  .changed { border-color: var(--teal); background: #F0FCF9; }
  #celebrate { position: fixed; inset: 0; z-index: 40; background: rgba(0, 30, 90, .45); display: none; align-items: center; justify-content: center; padding: 16px; }
  #celebrate.open { display: flex; flex-direction: column; }
  #celebrate > * { max-width: 420px; width: 100%; }
  #celebrate .boom { font-size: 64px; text-align: center; animation: pop .6s ease-out; }
  #celebrate .sale-line { background: #fff; border-radius: 14px; padding: 12px 16px; margin-top: 8px; text-align: center; font-size: 17px; border: 3px solid var(--teal); }
  @keyframes pop { 0% { transform: scale(.2) rotate(-20deg); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .btn.danger { color: var(--red); border-color: #F3C5C1; }
  label.check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; margin-top: 10px; }
  label.check input { width: auto; }
  tr.total td { background: #F3F6FB; }
  #toast { position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%); background: #1B2433; color: #fff; padding: 10px 16px;
    border-radius: 10px; z-index: 20; display: none; max-width: 90%; text-align: center; }
  #toast.err { background: var(--red); }
  #loading { position: fixed; inset: 0; background: rgba(255,255,255,.6); z-index: 30; display: none; align-items: center; justify-content: center; font-size: 16px; color: var(--blue); }
  .tpl { text-align: right; width: 100%; margin-bottom: 6px; }
  .more { display: block; margin: 10px auto; }
  @media (min-width: 700px) { .stats { grid-template-columns: repeat(6, 1fr); } }
</style>
</head>
